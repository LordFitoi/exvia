<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="server-url" content="https://exvia.up.railway.app">
    <title>Exvia</title>
    <link rel="stylesheet" href="offline.css">
    <script src="offline.js" defer></script>
  </head>
  <body>
    <main class="screen">
      <div class="hero" aria-hidden="true">
        <span class="ring ring-outer"></span>
        <span class="ring ring-middle"></span>
        <span class="badge">
          <svg class="badge-mark" viewBox="0 0 512 512" fill="none">
            <mask id="route-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
              <rect width="512" height="512" fill="#fff"></rect>
              <path d="M140 140 372 372" stroke="#000" stroke-width="96"></path>
            </mask>
            <path d="M140 372C240 372 272 140 372 140" stroke="#c8fad6" stroke-width="60" stroke-linecap="round" mask="url(#route-gap)"></path>
            <path d="M140 140 372 372" stroke="#fff" stroke-width="60" stroke-linecap="round"></path>
            <circle cx="372" cy="140" r="20" fill="#006b5e"></circle>
          </svg>
        </span>
        <span class="signal">
          <svg class="signal-icon" viewBox="0 0 24 24">
            <path d="M2 8.8a15 15 0 0 1 20 0M5.4 12.4a10 10 0 0 1 13.2 0M8.8 16a5 5 0 0 1 6.4 0"></path>
            <path d="m4 4 16 16"></path>
          </svg>
        </span>
      </div>

      <section class="message">
        <h1 class="title">Can't reach Exvia</h1>
        <p id="status" class="description" role="status">
          Your ride is waiting. Check your Wi-Fi or mobile data and we'll get you back on the road.
        </p>
      </section>

      <button id="retry" class="button" type="button">
        <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.5h-4.5"></path>
        </svg>
        <span id="retry-label">Try again</span>
      </button>

      <ul class="tips">
        <li class="tip">Turn off airplane mode</li>
        <li class="tip">Move to a better signal</li>
        <li class="tip">Reopen the app</li>
      </ul>
    </main>
  </body>
</html>
