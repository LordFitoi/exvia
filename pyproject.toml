[tool.poetry]
name = "exvia"
version = "0.1.0"
description = "Django Template"
authors = ["Nahum Santana <nahumsantanam@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
Django = "5.0.6"
asgiref = "3.8.1"
gunicorn = "22.0.0"
psycopg2 = "2.9.9"
sqlparse = "0.5.0"
whitenoise = "6.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
