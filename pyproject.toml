[tool.poetry]
name = "exvia"
version = "0.1.0"
description = "Django Template"
authors = ["Nahum Santana <nahumsantanam@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
Django = "~5.2"
asgiref = "^3.9.0"
sqlparse = "0.5.0"
whitenoise = "6.7.0"
psycopg2-binary = "2.9.13"
djangorestframework = "3.15.2"
djangorestframework-simplejwt = "^5.5.1"
pillow = "^12.3.0"
channels = "^4.3"
uvicorn = {version = "^0.34", extras = ["standard"]}
channels-redis = "^4.3"
pywebpush = "^2.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
